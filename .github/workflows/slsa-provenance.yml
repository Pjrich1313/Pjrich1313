name: Artifact Attestations (Provenance)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write
  actions: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create protected files folder
        run: |
          set -euo pipefail
          mkdir -p protected-archive
          cp -v README.md PROTECTED.md agents.md CODEOWNERS protected-archive/
          cp -v .github/workflows/*.yml protected-archive/
          find protected-archive -type f | sort

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: protected-archive/
          show-summary: true

      - name: Upload protected folder
        uses: actions/upload-artifact@v4
        with:
          name: protected-archive
          path: protected-archive/
          if-no-files-found: error
          retention-days: 90
