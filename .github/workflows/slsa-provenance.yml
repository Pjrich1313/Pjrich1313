name: Artifact Attestations (Provenance)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create protected files archive
        run: |
          set -euo pipefail
          mkdir -p protected-archive
          cp -v README.md PROTECTED.md agents.md CODEOWNERS protected-archive/ || true
          cp -v .github/workflows/*.yml protected-archive/ || true
          tar -czf protected-files.tar.gz -C protected-archive .
          ls -lh protected-files.tar.gz

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: protected-files.tar.gz
          show-summary: true
